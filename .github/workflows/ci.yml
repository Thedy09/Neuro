name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q

  frontend:
    name: Web · typecheck + lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        # The committed lock file is not fully in sync with package.json, so use
        # `npm install` (not `npm ci`). --legacy-peer-deps tolerates the known
        # qrcode.react/react peer mismatch from a transitive dep.
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  anchor:
    name: Solana program · anchor build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      ANCHOR_VERSION: "0.31.1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + anchor
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Install Solana CLI (anza)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor (avm)
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install "$ANCHOR_VERSION"
          avm use "$ANCHOR_VERSION"

      - name: Generate a CI keypair
        run: solana-keygen new --no-bip39-passphrase --force -o ~/.config/solana/id.json

      - name: Build program
        run: anchor build
