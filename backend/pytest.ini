[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# Block anchorpy's pytest11 plugin: it imports the legacy `pytest_xprocess`
# module (removed in modern pytest-xprocess) and would crash collection. We
# don't use its fixtures. `-p no:` in addopts is applied before entry-point
# loading, so this prevents the import entirely.
addopts = -p no:anchorpy
filterwarnings =
    ignore::DeprecationWarning
